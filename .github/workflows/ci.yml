name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build -o /tmp/radar ./cmd/radar
      - name: Installed coding-agent hooks regression
        run: python3 scripts/agent-hooks-test.py /tmp/radar
      - name: Native plugin package wiring
        run: python3 -m unittest discover -s integrations/plugins -p 'test_*.py'
      - name: Typed report consumer
        run: |
          node --test integrations/report/test.mjs
          npm install --prefix "$RUNNER_TEMP/radar-types" --no-save --ignore-scripts --package-lock=false typescript@5.9.3
          "$RUNNER_TEMP/radar-types/node_modules/.bin/tsc" --strict --noEmit --target ES2022 --lib ES2022,DOM --module ESNext --moduleResolution Bundler integrations/report/test-types.ts
      - name: GitHub Actions PR driver regression
        env:
          RADAR_TEST_BIN: /tmp/radar
        run: |
          python3 integrations/github-actions/test_workflow.py
          python3 integrations/github-actions/test_pr_matrix.py
          python3 integrations/github-actions/test_publish_matrix.py
          python3 integrations/github-actions/test_publish_checks.py
      - name: Release archive metadata regression
        run: python3 scripts/release-test.py
      - name: Benchmark harness and executable trusted fixture
        env:
          RADAR_BENCHMARK_BIN: /tmp/radar
        run: |
          python3 -m unittest discover -s benchmarks -p 'test_*.py'
          python3 -m unittest discover -s benchmarks/external -p 'test_*.py'
          python3 -m unittest discover -s benchmarks/history -p 'test_*.py'
      - name: Gate smoke test (two passing branches, one failing combination)
        run: bash scripts/smoke.sh /tmp/radar
      - name: End-to-end demo
        run: bash examples/organization/demo.sh /tmp/radar
      - name: Committed verification demo
        run: bash examples/verification/demo.sh /tmp/radar
      - name: Combined integration demo
        run: bash examples/integration/demo.sh /tmp/radar
      - name: README quickstart demo
        run: bash examples/quickstart/demo.sh /tmp/radar
      - name: Migrations demo
        run: bash examples/migrations/demo.sh /tmp/radar
      - name: Supported symbol and declared uniqueness demo
        run: bash examples/static-rules/demo.sh /tmp/radar
      - name: Continuous worktree watch demo
        run: bash examples/watch/demo.sh /tmp/radar
      - name: Saved worktree drift demo
        run: bash examples/drift/demo.sh /tmp/radar
      - name: Landing and retained proof demo
        run: bash examples/landing/demo.sh /tmp/radar
      - name: Intelligent verification demo
        run: bash examples/intelligent-verification/demo.sh /tmp/radar
      - name: Gate safety and bounded selection demo
        run: bash examples/selection-eval/demo.sh /tmp/radar
      - name: Java Maven combination demo (runner JDK and Maven)
        env:
          RADAR_DEMO_REQUIRE: "1"
        run: bash examples/java-maven/demo.sh /tmp/radar --prime
      - name: C++ CMake combination demo (runner CMake and compiler)
        env:
          RADAR_DEMO_REQUIRE: "1"
        run: bash examples/cpp-cmake/demo.sh /tmp/radar
      - name: Offline binary installer checks
        run: bash scripts/install-release-test.sh
      - name: Native release packaging
        run: |
          bash scripts/release.sh /tmp/radar-release 0.0.0-ci
          python3 scripts/validate-release.py /tmp/radar-release 0.0.0-ci

  workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
      - name: Install pinned workflow syntax validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Workflow syntax and expressions
        run: actionlint -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml integrations/github-actions/radar-pull-request.yml
      - name: Workflow security and required checks regression
        run: python3 scripts/workflow-test.py

  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native Windows installer regression
        shell: pwsh
        run: ./scripts/install-release-test.ps1

  macos-default-tmpdir:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Inspect native Python installation
        run: |
          python3 - <<'PY'
          import json, os, site, sys, sysconfig
          print(json.dumps({"executable": sys.executable, "canonical_executable": os.path.realpath(sys.executable), "version": sys.version, "prefix": sys.prefix, "base_prefix": sys.base_prefix, "paths": sysconfig.get_paths(), "sys_path": sys.path, "site_packages": site.getsitepackages()}, indent=2))
          PY
      - name: Build and smoke with the unmodified macOS TMPDIR
        run: |
          go test -count=1 ./internal/git ./internal/integration -run 'Test.*(Symlink|Canonical|Candidate)'
          go build -o "$RUNNER_TEMP/radar" ./cmd/radar
          bash scripts/smoke.sh "$RUNNER_TEMP/radar"

  windows-native:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Inspect native Python installation
        shell: pwsh
        run: |
          @'
          import json, os, site, sys, sysconfig
          print(json.dumps({"executable": sys.executable, "canonical_executable": os.path.realpath(sys.executable), "version": sys.version, "prefix": sys.prefix, "base_prefix": sys.base_prefix, "paths": sysconfig.get_paths(), "sys_path": sys.path, "site_packages": site.getsitepackages()}, indent=2))
          '@ | python3 -
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          update: true
      - name: Expose native compiler
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          "$env:MSYS_ROOT\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Native Windows tests including private candidate byte preservation
        shell: bash
        run: |
          git config core.autocrlf true
          go test -p=1 -count=1 ./... -timeout 45m
          python scripts/release.py "$RUNNER_TEMP/radar-release" 0.0.0-ci
          python scripts/validate-release.py "$RUNNER_TEMP/radar-release" 0.0.0-ci
