name: Native release qualification
# Tags prepare assets only. Publication requires an explicit manual request and
# the protected 'release' environment; this workflow never creates a tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected existing version tag after native validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux_amd64 }
          - { os: ubuntu-22.04-arm, target: linux_arm64 }
          - { os: macos-15-intel, target: darwin_amd64 }
          - { os: macos-15, target: darwin_arm64 }
          # windows_amd64 returns once Windows Git (autocrlf, long paths) qualifies.
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Native Windows C compiler
        if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          update: true
      - name: Expose native Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          "$env:MSYS_ROOT\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Pin release version and clean source
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dryrun.${GITHUB_SHA::7}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          echo "RADAR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Vet and test (required on every host)
        shell: bash
        run: |
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Packaging regression
        run: python scripts/release-test.py
      - name: Unix installer regression
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/install-release-test.sh
      - name: Windows installer regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-release-test.ps1
      - name: Build native archive and execute native smoke
        shell: bash
        run: python scripts/release.py "$RUNNER_TEMP/out" "$RADAR_VERSION"
      - name: Unpack and validate the distributed artifact
        shell: bash
        run: python scripts/validate-release.py "$RUNNER_TEMP/out" "$RADAR_VERSION"
      - name: Clean source after validation
        shell: bash
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-${{ matrix.target }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  collect:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: radar-*
          path: dist
          merge-multiple: true
      - name: Verify complete assets and checksums
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          cd dist
          sha256sum --check *.sha256
          cat *.sha256 > checksums.txt
      - name: Prepare Homebrew formula for manual review
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bash scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist > dist/radar.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-release-assets
          path: dist
      - name: Reverify assets
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Publish the already existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Radar $GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"
