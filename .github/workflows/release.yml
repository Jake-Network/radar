name: Native release qualification
# Tags prepare assets only. Publication requires an explicit manual request and
# the protected 'release' environment; this workflow never creates a tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to qualify (empty uses the selected ref)
        type: string
        default: ''
      publish:
        description: Publish the selected existing version tag after native validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve an immutable source commit
        id: source
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
            if [[ "$tag" == *-* ]]; then
              IFS=. read -r -a identifiers <<< "${tag#*-}"
              for identifier in "${identifiers[@]}"; do
                if [[ "$identifier" =~ ^[0-9]+$ ]]; then
                  [[ "$identifier" =~ ^(0|[1-9][0-9]*)$ ]]
                fi
              done
            fi
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
            version="${tag#v}"
          else
            # Branch dispatches remain qualification-only dry runs.
            [[ "$REQUESTED_PUBLISH" != true ]]
            sha="$GITHUB_SHA"
            version="0.0.0-dryrun.${sha::7}"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntag=%s\nversion=%s\n' "$sha" "$tag" "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux_amd64 }
          - { os: ubuntu-22.04-arm, target: linux_arm64 }
          - { os: macos-15-intel, target: darwin_amd64 }
          - { os: macos-15, target: darwin_arm64 }
          - { os: windows-2022, target: windows_amd64 }
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Native Windows C compiler
        if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          update: true
      - name: Expose native Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          "$env:MSYS_ROOT\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Pin release version and clean source
        shell: bash
        env:
          SOURCE_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "RADAR_VERSION=$SOURCE_VERSION" >> "$GITHUB_ENV"
      - name: Vet and test (required on every host)
        shell: bash
        run: |
          go vet ./...
          # Slower hosts (macOS Intel) exceed go test's default 10m per package.
          go test ./... -timeout 60m
          go test -race ./... -timeout 60m
      - name: Packaging regression
        run: python scripts/release-test.py
      - name: Unix installer regression
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/install-release-test.sh
      - name: Windows installer regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-release-test.ps1
      - name: Build native archive and execute native smoke
        shell: bash
        run: python scripts/release.py "$RUNNER_TEMP/out" "$RADAR_VERSION"
      - name: Unpack and validate the distributed artifact
        shell: bash
        run: python scripts/validate-release.py "$RUNNER_TEMP/out" "$RADAR_VERSION"
      - name: Clean source after validation
        shell: bash
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-${{ matrix.target }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  collect:
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: radar-*
          path: dist
          merge-multiple: true
      - name: Verify complete assets and checksums
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          cd dist
          sha256sum --check *.sha256
          cat *.sha256 > checksums.txt
      - name: Prepare Homebrew formula for manual review
        if: needs.resolve.outputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: bash scripts/homebrew-formula.sh "$RELEASE_TAG" dist > dist/radar.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && needs.resolve.outputs.tag != ''
    needs: [resolve, collect]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Confirm the existing tag still identifies the qualified commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-release-assets
          path: dist
      - name: Reverify assets
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Publish the already existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          prerelease=()
          [[ "$RELEASE_TAG" == *-* ]] && prerelease+=(--prerelease)
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Radar $RELEASE_TAG" --generate-notes --verify-tag "${prerelease[@]}"
